name: Deploy FPMS API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # ==========================================================
      # 1. CHECKOUT SOURCE CODE
      # ==========================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ==========================================================
      # 2. SHOW RUNNER INFORMATION
      # ==========================================================
      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "FPMS API Deployment Started"
          Write-Host "======================================"
          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "User     : $env:USERNAME"
          Write-Host "Runner   : $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "======================================"


      # ==========================================================
      # 3. SETUP .NET 8 SDK
      # ==========================================================
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ==========================================================
      # 4. CHECK .NET
      # ==========================================================
      - name: Check .NET
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "Checking .NET SDK"
          Write-Host "======================================"

          dotnet --version
          dotnet --info

          Write-Host "======================================"
          Write-Host ".NET SDK is available"
          Write-Host "======================================"


      # ==========================================================
      # 5. RESTORE API
      # ==========================================================
      - name: Restore API
        shell: powershell
        working-directory: DFN_BMS
        run: |
          Write-Host "======================================"
          Write-Host "Restoring FPMS API"
          Write-Host "======================================"

          dotnet restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host "Restore completed successfully."


      # ==========================================================
      # 6. BUILD API
      # ==========================================================
      - name: Build API
        shell: powershell
        working-directory: DFN_BMS
        run: |
          Write-Host "======================================"
          Write-Host "Building FPMS API"
          Write-Host "======================================"

          dotnet build `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host "Build completed successfully."


      # ==========================================================
      # 7. PUBLISH API
      # ==========================================================
      - name: Publish API
        shell: powershell
        working-directory: DFN_BMS
        run: |

          $publishPath = Join-Path $env:RUNNER_TEMP "FPMS_API"

          Write-Host "======================================"
          Write-Host "Publishing FPMS API"
          Write-Host "======================================"

          Write-Host "Publish path:"
          Write-Host $publishPath

          # Remove old temporary publish folder
          if (Test-Path $publishPath) {

              Write-Host "Removing previous publish folder..."

              Remove-Item `
                -Path $publishPath `
                -Recurse `
                -Force
          }

          # Create publish folder
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $publishPath | Out-Null

          # Publish API
          dotnet publish `
            --configuration Release `
            --no-build `
            --output $publishPath

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }

          if (!(Test-Path $publishPath)) {
              throw "Publish folder was not created."
          }

          Write-Host "======================================"
          Write-Host "API published successfully."
          Write-Host "======================================"


      # ==========================================================
      # 8. BACKUP EXISTING LIVE API
      # ==========================================================
      - name: Backup Existing API
        shell: powershell
        run: |

          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-12-08-2026 V1\API"

          $backupRoot = "D:\EZ Hosting\FPMS_LWN\Backups\API"

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"

          $backupPath = Join-Path $backupRoot $timestamp

          Write-Host "======================================"
          Write-Host "Creating API Backup"
          Write-Host "======================================"

          Write-Host "Live API:"
          Write-Host $livePath

          Write-Host "Backup Root:"
          Write-Host $backupRoot

          Write-Host "Backup Path:"
          Write-Host $backupPath


          # Check live API
          if (!(Test-Path $livePath)) {

              throw "Live API folder does not exist: $livePath"
          }


          # Automatically create Backups\API
          if (!(Test-Path $backupRoot)) {

              Write-Host "Backup root does not exist."
              Write-Host "Creating backup root..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $backupRoot | Out-Null
          }


          # Automatically create timestamp folder
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $backupPath | Out-Null


          # Copy existing API to backup
          robocopy `
            $livePath `
            $backupPath `
            /E `
            /R:2 `
            /W:2


          # Robocopy:
          # 0-7 = success
          # 8+  = failure

          if ($LASTEXITCODE -ge 8) {

              throw "API backup failed. Robocopy exit code: $LASTEXITCODE"
          }


          Write-Host "======================================"
          Write-Host "Backup completed successfully."
          Write-Host "Backup location:"
          Write-Host $backupPath
          Write-Host "======================================"


      # ==========================================================
      # 9. REPLACE LIVE API
      # ==========================================================
      - name: Replace Live API
        shell: powershell
        run: |

          $sourcePath = Join-Path $env:RUNNER_TEMP "FPMS_API"

          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-12-08-2026 V1\API"

          Write-Host "======================================"
          Write-Host "Replacing Live API"
          Write-Host "======================================"

          Write-Host "Published API:"
          Write-Host $sourcePath

          Write-Host "Live API:"
          Write-Host $livePath


          # Check published API
          if (!(Test-Path $sourcePath)) {

              throw "Published API folder does not exist: $sourcePath"
          }


          # Check live folder
          if (!(Test-Path $livePath)) {

              Write-Host "Live API folder does not exist."
              Write-Host "Creating live API folder..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $livePath | Out-Null
          }


          # Copy published API to live API
          robocopy `
            $sourcePath `
            $livePath `
            /MIR `
            /R:2 `
            /W:2


          # Robocopy:
          # 0-7 = success
          # 8+  = failure

          if ($LASTEXITCODE -ge 8) {

              throw "API deployment failed. Robocopy exit code: $LASTEXITCODE"
          }


          Write-Host "======================================"
          Write-Host "Live API replaced successfully."
          Write-Host "======================================"


      # ==========================================================
      # 10. VERIFY DEPLOYMENT
      # ==========================================================
      - name: Verify API Deployment
        shell: powershell
        run: |

          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-12-08-2026 V1\API"

          Write-Host "======================================"
          Write-Host "Verifying API Deployment"
          Write-Host "======================================"

          Write-Host "Checking:"
          Write-Host "$livePath\DFN_BMS.dll"


          if (!(Test-Path "$livePath\DFN_BMS.dll")) {

              throw "DFN_BMS.dll was not found after deployment."
          }


          Write-Host "DFN_BMS.dll found."


          # Check appsettings
          if (!(Test-Path "$livePath\appsettings.json")) {

              Write-Warning "appsettings.json was not found."
          }
          else {

              Write-Host "appsettings.json found."
          }


          Write-Host "======================================"
          Write-Host "Deployment verified successfully."
          Write-Host "======================================"


      # ==========================================================
      # 11. DEPLOYMENT SUCCESS
      # ==========================================================
      - name: Deployment completed
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "      FPMS API DEPLOYMENT SUCCESSFUL"
          Write-Host "=============================================="
          Write-Host "API Location:"
          Write-Host "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-12-08-2026 V1\API"
          Write-Host ""
          Write-Host "Backup Location:"
          Write-Host "D:\EZ Hosting\FPMS_LWN\Backups\API"
          Write-Host "=============================================="
