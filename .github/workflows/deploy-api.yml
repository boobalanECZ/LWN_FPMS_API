name: Deploy FPMS API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE CODE
      # ============================================================
      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. SHOW RUNNER INFORMATION
      # ============================================================
      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "FPMS API DEPLOYMENT STARTED"
          Write-Host "======================================"

          Write-Host "Computer : $env:COMPUTERNAME"
          Write-Host "User     : $env:USERNAME"
          Write-Host "Runner   : $env:RUNNER_NAME"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Write-Host "Temp     : $env:RUNNER_TEMP"

          Write-Host "======================================"


      # ============================================================
      # 3. SETUP .NET 8 SDK
      # ============================================================
      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'


      # ============================================================
      # 4. CHECK .NET
      # ============================================================
      - name: Check .NET
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "CHECKING .NET"
          Write-Host "======================================"

          dotnet --version
          dotnet --list-sdks

          if ($LASTEXITCODE -ne 0) {
              throw ".NET SDK is not available."
          }

          Write-Host ".NET SDK is available."


      # ============================================================
      # 5. RESTORE API
      # ============================================================
      - name: Restore API
        shell: powershell
        working-directory: DFN_BMS
        run: |
          Write-Host "======================================"
          Write-Host "RESTORING FPMS API"
          Write-Host "======================================"

          dotnet restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet restore failed."
          }

          Write-Host "Restore completed successfully."


      # ============================================================
      # 6. BUILD API
      # ============================================================
      - name: Build API
        shell: powershell
        working-directory: DFN_BMS
        run: |
          Write-Host "======================================"
          Write-Host "BUILDING FPMS API"
          Write-Host "======================================"

          dotnet build `
            --configuration Release `
            --no-restore

          if ($LASTEXITCODE -ne 0) {
              throw "dotnet build failed."
          }

          Write-Host "Build completed successfully."


      # ============================================================
      # 7. PUBLISH API
      # ============================================================
      - name: Publish API
        shell: powershell
        working-directory: DFN_BMS
        run: |

          $publishPath = "$env:RUNNER_TEMP\FPMS_API"

          Write-Host "======================================"
          Write-Host "PUBLISHING FPMS API"
          Write-Host "======================================"

          Write-Host "Publish path:"
          Write-Host $publishPath


          # Remove previous publish folder
          if (Test-Path $publishPath) {

              Write-Host "Removing previous publish folder..."

              Remove-Item `
                $publishPath `
                -Recurse `
                -Force
          }


          # Create publish folder
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $publishPath | Out-Null


          # Publish
          dotnet publish `
            --configuration Release `
            --no-build `
            --output $publishPath


          if ($LASTEXITCODE -ne 0) {
              throw "dotnet publish failed."
          }


          # Check publish folder
          if (!(Test-Path $publishPath)) {
              throw "Publish failed. Folder was not created."
          }


          # Check DLL
          if (!(Test-Path "$publishPath\DFN_BMS.dll")) {
              throw "DFN_BMS.dll was not found in publish folder."
          }


          Write-Host "API published successfully."
          Write-Host "DFN_BMS.dll found."


      # ============================================================
      # 8. BACKUP EXISTING API
      # ============================================================
      - name: Backup Existing API
        shell: powershell
        run: |

          # ========================================================
          # ACTUAL LIVE API PATH
          # ========================================================
          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\API"


          # ========================================================
          # BACKUP ROOT
          # ========================================================
          $backupRoot = "D:\EZ Hosting\FPMS_LWN\Backups\API"


          # ========================================================
          # TIMESTAMP
          # ========================================================
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"

          $backupPath = Join-Path $backupRoot $timestamp


          Write-Host "======================================"
          Write-Host "CREATING API BACKUP"
          Write-Host "======================================"

          Write-Host "Live API:"
          Write-Host $livePath

          Write-Host "Backup Root:"
          Write-Host $backupRoot

          Write-Host "Backup Path:"
          Write-Host $backupPath


          # ========================================================
          # CHECK LIVE API
          # ========================================================
          if (!(Test-Path $livePath)) {

              throw "Live API folder does not exist: $livePath"
          }


          # ========================================================
          # CREATE BACKUP ROOT AUTOMATICALLY
          # ========================================================
          if (!(Test-Path $backupRoot)) {

              Write-Host "Backup root does not exist."
              Write-Host "Creating backup root..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $backupRoot | Out-Null
          }


          # ========================================================
          # CREATE TIMESTAMP BACKUP FOLDER
          # ========================================================
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $backupPath | Out-Null


          # ========================================================
          # BACKUP CURRENT API
          # ========================================================
          Write-Host "Starting API backup..."

          robocopy `
            $livePath `
            $backupPath `
            /E `
            /R:2 `
            /W:2


          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy backup exit code: $robocopyExitCode"


          # ========================================================
          # ROBOCOPY:
          # 0-7 = SUCCESS
          # 8+  = FAILURE
          # ========================================================
          if ($robocopyExitCode -ge 8) {

              throw "API backup failed. Robocopy exit code: $robocopyExitCode"
          }


          # Prevent GitHub Actions from treating
          # Robocopy exit code 1-7 as a failure.
          $global:LASTEXITCODE = 0


          Write-Host "======================================"
          Write-Host "API BACKUP COMPLETED SUCCESSFULLY"
          Write-Host "Backup location:"
          Write-Host $backupPath
          Write-Host "======================================"


      # ============================================================
      # 9. REPLACE LIVE API
      # ============================================================
      - name: Replace Live API
        shell: powershell
        run: |

          # ========================================================
          # PUBLISHED API
          # ========================================================
          $sourcePath = "$env:RUNNER_TEMP\FPMS_API"


          # ========================================================
          # ACTUAL LIVE API PATH
          # ========================================================
          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\API"


          Write-Host "======================================"
          Write-Host "REPLACING LIVE API"
          Write-Host "======================================"

          Write-Host "Published API:"
          Write-Host $sourcePath

          Write-Host "Live API:"
          Write-Host $livePath


          # ========================================================
          # CHECK PUBLISHED API
          # ========================================================
          if (!(Test-Path $sourcePath)) {

              throw "Published API folder does not exist: $sourcePath"
          }


          # ========================================================
          # CHECK DLL
          # ========================================================
          if (!(Test-Path "$sourcePath\DFN_BMS.dll")) {

              throw "DFN_BMS.dll was not found in published API."
          }


          # ========================================================
          # CREATE LIVE API FOLDER IF REQUIRED
          # ========================================================
          if (!(Test-Path $livePath)) {

              Write-Host "Live API folder does not exist."
              Write-Host "Creating live API folder..."

              New-Item `
                -ItemType Directory `
                -Force `
                -Path $livePath | Out-Null
          }


          # ========================================================
          # DEPLOY
          # ========================================================
          Write-Host "Starting API deployment..."

          robocopy `
            $sourcePath `
            $livePath `
            /MIR `
            /R:2 `
            /W:2


          $robocopyExitCode = $LASTEXITCODE

          Write-Host "Robocopy deployment exit code: $robocopyExitCode"


          # ========================================================
          # ROBOCOPY:
          # 0-7 = SUCCESS
          # 8+  = FAILURE
          # ========================================================
          if ($robocopyExitCode -ge 8) {

              throw "API deployment failed. Robocopy exit code: $robocopyExitCode"
          }


          # Reset Robocopy exit code
          $global:LASTEXITCODE = 0


          Write-Host "======================================"
          Write-Host "LIVE API REPLACED SUCCESSFULLY"
          Write-Host "======================================"


      # ============================================================
      # 10. VERIFY DEPLOYMENT
      # ============================================================
      - name: Verify API Deployment
        shell: powershell
        run: |

          # ========================================================
          # ACTUAL LIVE API PATH
          # ========================================================
          $livePath = "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\API"


          Write-Host "======================================"
          Write-Host "VERIFYING API DEPLOYMENT"
          Write-Host "======================================"

          Write-Host "Live API:"
          Write-Host $livePath


          # ========================================================
          # CHECK API FOLDER
          # ========================================================
          if (!(Test-Path $livePath)) {

              throw "Live API folder does not exist."
          }


          # ========================================================
          # CHECK DLL
          # ========================================================
          if (!(Test-Path "$livePath\DFN_BMS.dll")) {

              throw "DFN_BMS.dll was not found after deployment."
          }


          # ========================================================
          # DLL INFORMATION
          # ========================================================
          $dll = Get-Item "$livePath\DFN_BMS.dll"


          Write-Host "DFN_BMS.dll found."
          Write-Host "File size: $($dll.Length) bytes"
          Write-Host "Last modified: $($dll.LastWriteTime)"


          Write-Host "======================================"
          Write-Host "API DEPLOYMENT VERIFIED SUCCESSFULLY"
          Write-Host "======================================"


      # ============================================================
      # 11. DEPLOYMENT COMPLETED
      # ============================================================
      - name: Deployment completed
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       FPMS API DEPLOYMENT SUCCESSFUL"
          Write-Host "=============================================="

          Write-Host "Server : $env:COMPUTERNAME"
          Write-Host "Time   : $(Get-Date)"

          Write-Host ""
          Write-Host "API Live Path:"
          Write-Host "D:\EZ Hosting\FPMS_LWN\912_LWN_FPMS-17-08-2026 V1\API"

          Write-Host ""
          Write-Host "Backup Path:"
          Write-Host "D:\EZ Hosting\FPMS_LWN\Backups\API"

          Write-Host ""
          Write-Host "=============================================="
